name: Order products CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: |
          cd order-products
          poetry install --no-root

      - name: Run tests
        run: |
          cd order-products
          poetry run python tests\run_tests.py

  dockerize-and-push-dev:
    needs: test
    runs-on: ubuntu-latest
    environment: development
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{secrets.DOCKER_USERNAME}}
        password: ${{secrets.DOCKER_TOKEN}}

    - name: Build Docker image
      run: |
        cd order-products
        docker build -t ${{secrets.DOCKER_USERNAME}}/ita-order-products:dev .
        docker tag ${{secrets.DOCKER_USERNAME}}/ita-order-products:dev ${{secrets.DOCKER_USERNAME}}/ita-order-products:${{github.sha}}

    - name: Push Docker image to Docker Hub
      run: |
        cd order-products
        docker push ${{secrets.DOCKER_USERNAME}}/ita-order-products:dev
        docker push ${{secrets.DOCKER_USERNAME}}/ita-order-products:${{github.sha}}
