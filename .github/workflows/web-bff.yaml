name: Web BFF CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# No need to define env since the application won't be ran in this workflow

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-bff

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web-bff/node_modules
          key: ${{runner.os}}-web-bff-${{hashFiles('web-bff/package-lock.json')}}
          restore-keys: |
            ${{runner.os}}-web-bff-

      - name: Install dependencies
        run: |
          npm ci

      - name: Build TypeScript code
        run: |
          npm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-bff-build
          path: web-bff/dist/
  
  dockerize-and-push:
    needs: test
    runs-on: ubuntu-latest
    environment: development
    defaults:
      run:
        working-directory: web-bff

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{secrets.DOCKER_USERNAME}}
        password: ${{secrets.DOCKER_TOKEN}}

    - name: Build Docker image
      run: |
        docker build -t ${{secrets.DOCKER_USERNAME}}/ita-web-bff:dev .
        docker tag ${{secrets.DOCKER_USERNAME}}/ita-web-bff:dev ${{secrets.DOCKER_USERNAME}}/ita-web-bff:${{github.sha}}

    - name: Push Docker image to Docker Hub
      run: |
        docker push ${{secrets.DOCKER_USERNAME}}/ita-web-bff:dev
        docker push ${{secrets.DOCKER_USERNAME}}/ita-web-bff:${{github.sha}}
