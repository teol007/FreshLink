apiVersion: apps.openshift.io/v1
kind: DeploymentConfig
metadata:
  labels:
    io.kompose.service: ita-manage-users-db
  name: ita-manage-users-db
spec:
  replicas: 1
  selector:
    io.kompose.service: ita-manage-users-db
  template:
    metadata:
      labels:
        io.kompose.service: ita-manage-users-db
    spec:
      containers:
        - env:
            - name: MONGO_INITDB_ROOT_PASSWORD
              value: password
            - name: MONGO_INITDB_ROOT_USERNAME
              value: root
          image: ' '
          name: ita-manage-users-db
          ports:
            - containerPort: 27017
              protocol: TCP
      restartPolicy: Always
  test: false
  triggers:
    - type: ConfigChange
    - imageChangeParams:
        automatic: true
        containerNames:
          - ita-manage-users-db
        from:
          kind: ImageStreamTag
          name: ita-manage-users-db:latest
      type: ImageChange
